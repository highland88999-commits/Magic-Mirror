<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Olympus By Merlin – The Vortex Mirror</title>
  <style>
    body { margin: 0; overflow: hidden; background: #010103; font-family: monospace; }
    canvas { display: block; outline: none; }
    
    #start-screen {
      position: absolute; inset: 0; z-index: 200;
      background: rgba(1, 1, 3, 0.95);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; color: #00ffff; text-align: center;
      cursor: pointer; transition: opacity 1.2s ease-out;
    }
    #start-text {
      font-size: 2.8rem; letter-spacing: 4px; text-shadow: 0 0 20px #00ffff;
      margin-bottom: 20px;
    }
    #ticker {
      font-size: 1.1rem; letter-spacing: 3px; color: #00ffaa;
      animation: ticker 1.8s linear infinite;
    }
    @keyframes ticker {
      0%   { opacity: 0.4; }
      50%  { opacity: 1; }
      100% { opacity: 0.4; }
    }
  </style>
</head>
<body>

<!-- Start Screen -->
<div id="start-screen">
  <div id="start-text">MIRROR, MIRROR ON THE WALL</div>
  <div id="ticker">INITIALIZING SEQUENCE...</div>
</div>

<div id="ui-layer" style="display:none;">SYSTEM_ONLINE</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/controls/OrbitControls.js';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010103); 

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
camera.position.set(0, 10, 30); 
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1; 
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.25, 0.6, 0.35));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.enablePan = false; 
controls.target.set(0, 15, 0);
controls.maxPolarAngle = Math.PI / 2 + 0.05; 

// Textures (using latest links)
const textureLoader = new THREE.TextureLoader();
const floorTex = textureLoader.load('https://files.catbox.moe/6xph8n.JPEG');
const innerDomeTex = textureLoader.load('https://files.catbox.moe/vpvm1x.JPEG');
const outerDomeTex = textureLoader.load('https://files.catbox.moe/vhffm6.JPEG');
const frameTex = textureLoader.load('https://files.catbox.moe/98i4rp.jpeg');

floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(4, 4);

// Build Scene
const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000),
  new THREE.MeshStandardMaterial({ map: floorTex, emissive: 0xffffff, emissiveIntensity: 0.3, roughness: 0.85 }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

scene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 64, 32, 0, Math.PI*2, 0, Math.PI/2),
  new THREE.MeshStandardMaterial({ map: innerDomeTex, emissive: 0xffffff, emissiveIntensity: 0.35, side: THREE.BackSide })));

scene.add(new THREE.Mesh(new THREE.SphereGeometry(102, 64, 32, 0, Math.PI*2, 0, Math.PI/2),
  new THREE.MeshStandardMaterial({ map: outerDomeTex, emissive: 0xffffff, emissiveIntensity: 0.5, side: THREE.FrontSide })));

// Mirror + Video
const mirrorGroup = new THREE.Group();
const video = document.createElement('video');
video.src = 'https://files.catbox.moe/4ab3h5.mp4';
video.loop = false;           // We control direction manually
video.muted = true;
video.playsInline = true;

const videoTex = new THREE.VideoTexture(video);
const videoMesh = new THREE.Mesh(new THREE.CircleGeometry(3.3, 64), new THREE.MeshBasicMaterial({ map: videoTex }));
videoMesh.position.set(0, 0, -0.15);
mirrorGroup.add(videoMesh);

// Frame
const frameMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: frameTex }, time: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      if(distance(vUv, vec2(0.5)) < 0.262) discard;
      float p = 1.0 + sin(time*1.5)*0.25;
      if(c.r>0.12||c.b>0.12) c.rgb *= p;
      gl_FragColor = vec4(c.rgb * smoothstep(0.5,0.44,distance(vUv,vec2(0.5))),1.0);
    }
  `,
  transparent: true, side: THREE.DoubleSide
});
mirrorGroup.add(new THREE.Mesh(new THREE.PlaneGeometry(12,12), frameMat));

mirrorGroup.position.set(0, 0, -14);
camera.add(mirrorGroup);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.15));
scene.add(new THREE.PointLight(0x00ffff, 60, 150).position.set(-20,30,20));
scene.add(new THREE.PointLight(0xaa00ff, 60, 150).position.set(20,30,-20));
scene.add(new THREE.DirectionalLight(0x4466ff, 1.2));

// Start Screen Click Handler
const startScreen = document.getElementById('start-screen');
let videoDirection = 1; // 1 = forward, -1 = backward

startScreen.addEventListener('click', () => {
  startScreen.style.opacity = '0';
  setTimeout(() => startScreen.style.display = 'none', 1200);

  video.play();
  
  // Ping-pong playback (forward → backward → forward...)
  const playPingPong = () => {
    video.playbackRate = videoDirection;
    video.play();
  };

  video.addEventListener('ended', () => {
    videoDirection *= -1;
    video.currentTime = videoDirection > 0 ? 0 : video.duration;
    playPingPong();
  });

  // Initial play
  playPingPong();
}, { once: true });

// Resize & Animation
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();

function loop() {
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();

  controls.update();
  frameMat.uniforms.time.value = t;

  mirrorGroup.position.y = Math.sin(t * 1.2) * 0.35;
  mirrorGroup.rotation.x = Math.sin(t * 0.8) * 0.02;
  mirrorGroup.rotation.y = Math.cos(t * 0.9) * 0.02;

  if (video.readyState >= 2) videoTex.needsUpdate = true;

  composer.render();
}
loop();
</script>
</body>
</html>
