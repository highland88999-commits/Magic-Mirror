<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Olympus By Merlin – The Vortex Mirror</title>
  <style>
    body { margin: 0; overflow: hidden; background: #010103; font-family: monospace; }
    canvas { display: block; outline: none; }
    #ui-layer {
      position: absolute; top: 20px; left: 20px; color: #00ffff;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.6); pointer-events: none; z-index: 100;
      letter-spacing: 1px; font-size: 14px;
    }
  </style>
</head>
<body>

<div id="ui-layer">SYSTEM_INITIALIZING // Awaiting assets...</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/controls/OrbitControls.js';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/UnrealBloomPass.js';

// ────────────────────────────────────────────────
// Scene Setup
// ────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010103); 

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
camera.position.set(0, 10, 30); 
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1; 
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// Post-processing Bloom
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.25, 0.6, 0.35);
composer.addPass(bloomPass);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.enablePan = false; 
controls.target.set(0, 15, 0);
controls.maxPolarAngle = Math.PI / 2 + 0.05; 
controls.maxDistance = 800; 
controls.minDistance = 1;

// ────────────────────────────────────────────────
// Loading Manager & Texture Loader
// ────────────────────────────────────────────────
const uiLayer = document.getElementById('ui-layer');
const manager = new THREE.LoadingManager();

manager.onStart = () => uiLayer.innerText = `SYSTEM_LOADING...`;
manager.onLoad = () => uiLayer.innerText = 'SYSTEM_ONLINE // Tap to initialize sequence.';
manager.onError = (url) => {
  uiLayer.innerText = `ERROR loading ${url}`;
  uiLayer.style.color = "#ff0044";
};

// CRITICAL: Passing manager to TextureLoader to ensure it tracks loading state
const textureLoader = new THREE.TextureLoader(manager);

const floorTex = textureLoader.load('Floor wrap.JPEG');
const innerDomeTex = textureLoader.load('Inner dome wrap.JPEG');
const outerDomeTex = textureLoader.load('Outer dome wrap.JPEG');
const frameTex = textureLoader.load('IMG_1488.jpeg');

[floorTex, innerDomeTex, outerDomeTex, frameTex].forEach(tex => {
  tex.colorSpace = THREE.SRGBColorSpace;
});

floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(4, 4);

// ────────────────────────────────────────────────
// Floor & Domes
// ────────────────────────────────────────────────
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(1000, 1000),
  new THREE.MeshStandardMaterial({ 
    map: floorTex, 
    emissive: 0xffffff,
    emissiveMap: floorTex,
    emissiveIntensity: 0.25, 
    roughness: 0.9
  })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(100, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2),
  new THREE.MeshStandardMaterial({ 
    map: innerDomeTex, 
    emissive: 0xffffff,
    emissiveMap: innerDomeTex,
    emissiveIntensity: 0.35,
    side: THREE.BackSide,
    roughness: 0.8 
  })
));

scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(102, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2),
  new THREE.MeshStandardMaterial({ 
    map: outerDomeTex, 
    emissive: 0xffffff,
    emissiveMap: outerDomeTex,
    emissiveIntensity: 0.5,
    side: THREE.FrontSide,
    roughness: 0.9
  })
));

// ────────────────────────────────────────────────
// Vortex Mirror
// ────────────────────────────────────────────────
const mirrorGroup = new THREE.Group();

const video = document.createElement('video');
video.src = 'gemini_generated_video_763BE1F0.mp4';
video.loop = true;
video.muted = true;
video.playsInline = true;
video.crossOrigin = "anonymous";

const videoTex = new THREE.VideoTexture(video);
videoTex.colorSpace = THREE.SRGBColorSpace;

mirrorGroup.add(new THREE.Mesh(
  new THREE.CircleGeometry(3.3, 64),
  new THREE.MeshBasicMaterial({ map: videoTex })
).position.set(0, 0, -0.15));

const frameMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: frameTex }, time: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv; void main() { 
    vec4 c = texture2D(tDiffuse, vUv); float d = distance(vUv, vec2(0.5));
    if(d < 0.262) discard; 
    c.rgb *= (1.0 + sin(time * 1.5) * 0.25);
    gl_FragColor = vec4(c.rgb * smoothstep(0.5, 0.44, d), 1.0); }`,
  transparent: true,
  side: THREE.DoubleSide
});

mirrorGroup.add(new THREE.Mesh(new THREE.PlaneGeometry(12, 12), frameMat));
mirrorGroup.position.set(0, 0, -14);
camera.add(mirrorGroup);

// ────────────────────────────────────────────────
// Lighting & Loop
// ────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.15));
scene.add(new THREE.PointLight(0x00ffff, 60, 150).position.set(-20, 30, 20));
scene.add(new THREE.PointLight(0xaa00ff, 60, 150).position.set(20, 30, -20));
scene.add(new THREE.DirectionalLight(0x4466ff, 1.2));

window.addEventListener('pointerdown', () => {
  if (video.paused) video.play();
  uiLayer.style.opacity = "0";
}, { once: true });

const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  controls.update();
  frameMat.uniforms.time.value = t;
  mirrorGroup.position.y = Math.sin(t * 1.2) * 0.35;
  if (video.readyState >= video.HAVE_CURRENT_DATA) videoTex.needsUpdate = true;
  composer.render();
}
loop();
</script>
</body>
</html>
