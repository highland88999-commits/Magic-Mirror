<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Olympus By Merlin – The Vortex Mirror</title>
<style>
  body { 
    margin: 0; 
    overflow: hidden; 
    background: #010103; 
    font-family: monospace;
    touch-action: none; 
  }
  canvas { 
    display: block; 
    outline: none;
    cursor: pointer;
  }
  /* Start Screen Overlay */
  #start-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: linear-gradient(rgba(1,1,3,0.35), rgba(1,1,3,0.75)), url('https://files.catbox.moe/4o8srk.jpeg') center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #00ffff;
    text-align: center;
    cursor: pointer;
    transition: opacity 1.8s ease-out, visibility 1.8s ease-out;
    overflow: hidden;
    transform: translateZ(0); 
  }
  #start-screen.hidden { 
    opacity: 0; 
    visibility: hidden;
    pointer-events: none;
  }
  #start-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url('https://files.catbox.moe/4o8srk.jpeg') center/cover no-repeat;
    transform: scaleX(-1);
    filter: blur(1.5px) brightness(1.15) contrast(1.1);
    animation: slowPan 50s linear infinite;
    opacity: 0.9;
  }
  #start-text {
    font-size: clamp(1.9rem, 6vw, 3rem);
    letter-spacing: 8px;
    text-shadow: 0 0 25px #00ffff, 0 0 60px #00ffff, 0 0 90px #0088ff;
    z-index: 2;
    position: relative;
    animation: float 4.5s ease-in-out infinite;
    pointer-events: none;
  }
  #ticker {
    font-size: clamp(0.95rem, 2.8vw, 1.15rem);
    letter-spacing: 5px;
    color: #00ffcc;
    margin-top: 18px;
    z-index: 2;
    position: relative;
    animation: ticker 1.6s linear infinite, glitch 0.4s infinite;
    pointer-events: none;
  }
  
  @keyframes ticker { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
  @keyframes glitch { 0% { text-shadow: 1px 0 #ff00ff, -1px 0 #00ffff; } 20% { text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff; } 40% { text-shadow: 1px 0 #00ffff, -1px 0 #ff00ff; } 100% { text-shadow: 1px 0 #ff00ff, -1px 0 #00ffff; } }
  @keyframes slowPan { 0% { background-position: 25% 50%; } 100% { background-position: 75% 50%; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  
  #hint-overlay {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    color: #00ffff;
    font-size: 14px;
    letter-spacing: 3px;
    opacity: 0;
    transition: opacity 1s ease-out;
    pointer-events: none;
    z-index: 1000;
  }
</style>
</head>
<body onclick="void(0)">

<div id="start-screen">
  <div id="start-text">MIRROR, MIRROR ON THE WALL</div>
  <div id="ticker">TAP TO INITIALIZE</div>
</div>

<div id="hint-overlay">TAP TO ENTER DOME</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/controls/OrbitControls.js';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/UnrealBloomPass.js';

// ────────────────────────────────────────────────
// Scene Setup
// ────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010103);

// Start camera far outside the massive dome (radius is 102)
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
camera.position.set(0, 50, 250);
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.5, 0.3);
composer.addPass(bloomPass);

// ────────────────────────────────────────────────
// Controls (Disabled until inside)
// ────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enabled = false; 
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = true;
controls.panSpeed = 0.6;
controls.target.set(0, 15, 0);
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 8;
controls.maxDistance = 90;

// ────────────────────────────────────────────────
// External Asset Loading
// ────────────────────────────────────────────────
const loader = new THREE.TextureLoader();
loader.setCrossOrigin('anonymous');

const floorTex = loader.load('https://files.catbox.moe/6xph8n.JPEG');
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(4, 4);
floorTex.colorSpace = THREE.SRGBColorSpace;

const innerDomeTex = loader.load('https://files.catbox.moe/vpvm1x.JPEG');
innerDomeTex.colorSpace = THREE.SRGBColorSpace;

const outerDomeTex = loader.load('https://files.catbox.moe/vhffm6.JPEG');
outerDomeTex.colorSpace = THREE.SRGBColorSpace;

const frameTex = loader.load('https://files.catbox.moe/98i4rp.jpeg');

// ────────────────────────────────────────────────
// Environment Geometries
// ────────────────────────────────────────────────
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(1000,1000), 
  new THREE.MeshStandardMaterial({ map: floorTex, emissive: 0x112233, emissiveIntensity: 0.25, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(100, 64, 32, 0, Math.PI*2, 0, Math.PI/2), 
  new THREE.MeshStandardMaterial({ map: innerDomeTex, emissive: 0x00aaff, emissiveIntensity: 0.4, side: THREE.BackSide })
));

// Outer Dome
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(102, 64, 32, 0, Math.PI*2, 0, Math.PI/2), 
  new THREE.MeshStandardMaterial({ map: outerDomeTex, emissive: 0xff00aa, emissiveIntensity: 0.55, side: THREE.FrontSide })
));

// ────────────────────────────────────────────────
// The Vortex Mirror
// ────────────────────────────────────────────────
const mirrorGroup = new THREE.Group();

const video = document.createElement('video');
video.src = 'https://files.catbox.moe/4ab3h5.mp4';
video.muted = true;
video.playsInline = true;
video.preload = 'auto';
video.loop = false;
video.crossOrigin = 'anonymous';

const videoTex = new THREE.VideoTexture(video);
videoTex.colorSpace = THREE.SRGBColorSpace;
videoTex.minFilter = THREE.LinearFilter;
videoTex.magFilter = THREE.LinearFilter;

const videoMesh = new THREE.Mesh(
  new THREE.CircleGeometry(3.3, 64),
  new THREE.MeshBasicMaterial({ map: videoTex })
);
videoMesh.position.set(0, 0, -0.15);
mirrorGroup.add(videoMesh);

const frameMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: frameTex }, time: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv; void main() { 
    vec4 c = texture2D(tDiffuse, vUv); float d = distance(vUv, vec2(0.5));
    if(d < 0.262) discard; 
    c.rgb *= (1.0 + sin(time * 1.5) * 0.25);
    gl_FragColor = vec4(c.rgb * smoothstep(0.5, 0.44, d), 1.0); }`,
  transparent: true,
  side: THREE.DoubleSide
});

const frameMesh = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), frameMat);
mirrorGroup.add(frameMesh);
mirrorGroup.position.set(0, 0, -14);
scene.add(mirrorGroup); // Added to scene instead of camera for independent tracking

// ────────────────────────────────────────────────
// Lighting
// ────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.15));
scene.add(new THREE.PointLight(0x00ffff, 60, 150).position.set(-20, 30, 20));
scene.add(new THREE.PointLight(0xaa00ff, 60, 150).position.set(20, 30, -20));
scene.add(new THREE.DirectionalLight(0x4466ff, 1.2));

// ────────────────────────────────────────────────
// App States & Interaction Sequence
// ────────────────────────────────────────────────
let appState = 'LANDING'; // LANDING -> OUTSIDE -> ENTERING -> INSIDE
const startScreen = document.getElementById('start-screen');
const hintOverlay = document.getElementById('hint-overlay');

// Target position inside the dome where the camera will rest
const insideCameraPos = new THREE.Vector3(0, 12, 35);
const centerTarget = new THREE.Vector3(0, 15, 0);

// Interaction 1: Dissolve Landing Screen
function dissolveLanding(e) {
  if (appState === 'LANDING') {
    e.stopPropagation(); // Stop click from bleeding into the next phase immediately
    appState = 'OUTSIDE';
    startScreen.classList.add('hidden');
    
    // Show prompt to click again after a short delay
    setTimeout(() => {
        if(appState === 'OUTSIDE') hintOverlay.style.opacity = 1;
    }, 1500);
  }
}
startScreen.addEventListener('click', dissolveLanding);
startScreen.addEventListener('pointerdown', dissolveLanding);

// Interaction 2: Enter the Dome
window.addEventListener('pointerdown', (e) => {
  if (appState === 'OUTSIDE') {
    appState = 'ENTERING';
    hintOverlay.style.opacity = 0; // Hide the prompt
    
    // Trigger video playback right as we start flying in
    video.play().catch(e => console.error("Video play failed:", e));
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ────────────────────────────────────────────────
// Cinematic Animation Loop
// ────────────────────────────────────────────────
const clock = new THREE.Clock();
let orbitAngle = 0;

function loop() {
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  
  frameMat.uniforms.time.value = t;
  
  // Organic hover for the mirror in the center
  mirrorGroup.position.y = Math.sin(t * 1.2) * 0.35;
  mirrorGroup.rotation.x = Math.sin(t * 0.8) * 0.02;
  mirrorGroup.rotation.y = Math.cos(t * 0.9) * 0.02;

  // Cinematic Camera State Machine
  if (appState === 'LANDING' || appState === 'OUTSIDE') {
    // Phase 1 & 2: Slowly orbit the outside of the dome
    orbitAngle += 0.002;
    camera.position.x = Math.sin(orbitAngle) * 250;
    camera.position.z = Math.cos(orbitAngle) * 250;
    camera.position.y = 50 + Math.sin(t * 0.5) * 10;
    camera.lookAt(centerTarget);
    
  } else if (appState === 'ENTERING') {
    // Phase 3: Smoothly interpolate (zoom) into the dome to the target position
    camera.position.lerp(insideCameraPos, 0.035);
    camera.lookAt(centerTarget);
    
    // Check if we have arrived inside
    if (camera.position.distanceTo(insideCameraPos) < 1.0) {
      appState = 'INSIDE';
      controls.enabled = true; // Unlock user panning
    }
    
  } else if (appState === 'INSIDE') {
    // Phase 4: Full user control
    controls.update();
  }

  if (video.readyState >= video.HAVE_CURRENT_DATA) {
    videoTex.needsUpdate = true;
  }
  
  composer.render();
}

loop();
</script>
</body>
</html>
