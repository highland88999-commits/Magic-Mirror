<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Olympus By Merlin – The Vortex Mirror</title>
<style>
  body { 
    margin: 0; 
    overflow: hidden; 
    background: #010103; 
    font-family: monospace; 
  }
  canvas { display: block; outline: none; }

  #start-screen {
    position: absolute;
    inset: 0;
    z-index: 200;
    background: linear-gradient(rgba(1,1,3,0.4), rgba(1,1,3,0.7)), url('https://files.catbox.moe/4o8srk.jpeg') center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #00ffff;
    text-align: center;
    cursor: pointer;
    transition: opacity 1.5s ease-out;
    overflow: hidden;
  }
  #start-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url('https://files.catbox.moe/4o8srk.jpeg') center/cover no-repeat;
    transform: scaleX(-1); /* Mirror effect */
    filter: blur(1px);
    animation: slowPan 45s linear infinite;
    opacity: 0.85;
  }
  #start-text {
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    letter-spacing: 6px;
    text-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff;
    z-index: 2;
    position: relative;
    animation: float 4s ease-in-out infinite;
  }
  #ticker {
    font-size: clamp(0.9rem, 2.5vw, 1.1rem);
    letter-spacing: 4px;
    color: #00ffaa;
    margin-top: 12px;
    z-index: 2;
    position: relative;
    animation: ticker 1.8s linear infinite, glitch 0.3s steps(2) infinite;
  }

  @keyframes ticker { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; }
  @keyframes glitch { 0%{text-shadow:0 0 5px #00ffaa} 33%{text-shadow:2px 0 #ff00ff, -2px 0 #00ffff} 66%{text-shadow:-1px 0 #00ffff, 1px 0 #ff00ff} 100%{text-shadow:0 0 5px #00ffaa} }
  @keyframes slowPan { 0% { background-position: 30% 50%; } 100% { background-position: 70% 50%; }
  @keyframes float { 0%,100%{transform: translateY(0)} 50%{transform: translateY(-8px)} }
</style>
</head>
<body>

<!-- Start Screen with Mirrored Panning Background -->
<div id="start-screen">
  <div id="start-text">MIRROR, MIRROR ON THE WALL</div>
  <div id="ticker">INITIALIZING SEQUENCE...</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/controls/OrbitControls.js';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010103);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
camera.position.set(0, 10, 30);
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// POST PROCESSING WITH UNREAL BLOOM
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.4, 0.6, 0.35);
composer.addPass(bloomPass);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.enablePan = false;
controls.target.set(0, 15, 0);
controls.maxPolarAngle = Math.PI / 2 + 0.05;

// TEXTURE LOADER WITH CORS
const textureLoader = new THREE.TextureLoader();
textureLoader.setCrossOrigin('anonymous');

// Textures
const floorTex = textureLoader.load('https://files.catbox.moe/6xph8n.JPEG');
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(4,4);

const innerDomeTex = textureLoader.load('https://files.catbox.moe/vpvm1x.JPEG');
const outerDomeTex = textureLoader.load('https://files.catbox.moe/vhffm6.JPEG');
const frameTex = textureLoader.load('https://files.catbox.moe/98i4rp.jpeg');

// Build Environment
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(1000, 1000), 
  new THREE.MeshStandardMaterial({ 
    map: floorTex, 
    emissive: 0xffffff, 
    emissiveIntensity: 0.3, 
    roughness: 0.85 
  })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(100, 64, 32, 0, Math.PI*2, 0, Math.PI/2), 
  new THREE.MeshStandardMaterial({ 
    map: innerDomeTex, 
    emissive: 0xffffff, 
    emissiveIntensity: 0.35, 
    side: THREE.BackSide 
  })
));

scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(102, 64, 32, 0, Math.PI*2, 0, Math.PI/2), 
  new THREE.MeshStandardMaterial({ 
    map: outerDomeTex, 
    emissive: 0xffffff, 
    emissiveIntensity: 0.5, 
    side: THREE.FrontSide 
  })
));

// Mirror + Video (ping-pong)
const mirrorGroup = new THREE.Group();
const video = document.createElement('video');
video.src = 'https://files.catbox.moe/4ab3h5.mp4';
video.loop = false;
video.muted = true;
video.playsInline = true;
video.preload = 'auto';

const videoTex = new THREE.VideoTexture(video);
videoTex.colorSpace = THREE.SRGBColorSpace;

const videoMesh = new THREE.Mesh(
  new THREE.CircleGeometry(3.3, 64), 
  new THREE.MeshBasicMaterial({ map: videoTex })
);
videoMesh.position.set(0, 0, -0.15);
mirrorGroup.add(videoMesh);

const frameMat = new THREE.ShaderMaterial({
  uniforms: { 
    tDiffuse: { value: frameTex }, 
    time: { value: 0 } 
  },
  vertexShader: `varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader: `
    uniform sampler2D tDiffuse; 
    uniform float time; 
    varying vec2 vUv; 
    void main(){ 
      vec4 c = texture2D(tDiffuse, vUv); 
      if(distance(vUv, vec2(0.5)) < 0.262) discard; 
      float p = 1.0 + sin(time*1.5)*0.25; 
      if(c.r>0.12||c.b>0.12) c.rgb *= p; 
      gl_FragColor = vec4(c.rgb * smoothstep(0.5,0.44,distance(vUv,vec2(0.5))),1.0); 
    } 
  `,
  transparent: true,
  side: THREE.DoubleSide
});
mirrorGroup.add(new THREE.Mesh(new THREE.PlaneGeometry(12,12), frameMat));
mirrorGroup.position.set(0, 0, -14);
camera.add(mirrorGroup);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.15));
scene.add(new THREE.PointLight(0x00ffff, 60, 150).position.set(-20,30,20));
scene.add(new THREE.PointLight(0xaa00ff, 60, 150).position.set(20,30,-20));
scene.add(new THREE.DirectionalLight(0x4466ff, 1.2));

// Start Screen Logic
const startScreen = document.getElementById('start-screen');
let videoDirection = 1;

startScreen.addEventListener('click', () => {
  startScreen.style.opacity = '0';
  setTimeout(() => startScreen.style.display = 'none', 1500);
  
  // Boost bloom after intro
  bloomPass.strength = 1.25;

  const playPingPong = () => {
    video.playbackRate = videoDirection;
    video.play().catch(e => console.warn('Video play failed:', e));
  };

  video.addEventListener('ended', () => {
    videoDirection *= -1;
    video.currentTime = videoDirection > 0 ? 0 : video.duration - 0.1;
    playPingPong();
  });

  playPingPong();
}, { once: true });

// Resize + Loop
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  controls.update();
  frameMat.uniforms.time.value = t;
  mirrorGroup.position.y = Math.sin(t * 1.2) * 0.35;
  mirrorGroup.rotation.x = Math.sin(t * 0.8) * 0.02;
  mirrorGroup.rotation.y = Math.cos(t * 0.9) * 0.02;
  if (video.readyState >= 2) videoTex.needsUpdate = true;
  composer.render();
}
loop();
</script>
</body>
</html>
