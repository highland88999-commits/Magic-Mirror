<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Olympus By Merlin – The Vortex Mirror</title>
<style>
  body { 
    margin: 0; overflow: hidden; background: #010103; font-family: monospace;
    touch-action: none; -webkit-touch-callout: none; user-select: none;
  }
  canvas { display: block; outline: none; }
  
  /* UI Manager */
  #ui-manager {
    position: fixed; inset: 0; z-index: 9999; cursor: pointer;
    display: flex; align-items: center; justify-content: center; text-align: center; color: #00ffff;
  }
  #landing-layer {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(rgba(1,1,3,0.35), rgba(1,1,3,0.75)), url('https://files.catbox.moe/4o8srk.jpeg') center/cover no-repeat;
    transition: opacity 1.2s ease-out;
  }
  #landing-layer::before {
    content: ''; position: absolute; inset: 0;
    background: url('https://files.catbox.moe/4o8srk.jpeg') center/cover no-repeat;
    transform: scaleX(-1); filter: blur(1.5px) brightness(1.15) contrast(1.1);
    animation: slowPan 50s linear infinite; opacity: 0.9; z-index: 0;
  }
  #start-text {
    font-size: clamp(1.5rem, 5vw, 3rem); letter-spacing: 6px; padding: 0 20px;
    text-shadow: 0 0 25px #00ffff, 0 0 60px #00ffff, 0 0 90px #0088ff; z-index: 2;
    animation: float 4.5s ease-in-out infinite;
  }
  #ticker {
    font-size: clamp(0.85rem, 2.5vw, 1.15rem); letter-spacing: 4px; color: #00ffcc; margin-top: 18px; z-index: 2;
    animation: ticker 1.6s linear infinite, glitch 0.4s infinite;
  }
  #hint-layer {
    position: absolute; bottom: 12%; font-size: clamp(1rem, 3vw, 1.5rem); letter-spacing: 5px;
    text-shadow: 0 0 15px #00ffff; opacity: 0; transition: opacity 1.5s ease-in; z-index: 3; pointer-events: none;
  }
  @keyframes ticker { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
  @keyframes glitch { 0% { text-shadow: 1px 0 #ff00ff, -1px 0 #00ffff; } 20% { text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff; } 40% { text-shadow: 1px 0 #00ffff, -1px 0 #ff00ff; } 100% { text-shadow: 1px 0 #ff00ff, -1px 0 #00ffff; } }
  @keyframes slowPan { 0% { background-position: 25% 50%; } 100% { background-position: 75% 50%; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
</style>

<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
</script>

<script>
  window.onerror = function(msg) {
    document.getElementById('ticker').innerText = 'SYS_ERR: ' + msg;
    document.getElementById('ticker').style.color = '#ff0044';
    return false;
  };

  let appState = 'LANDING';

  function handleMasterClick() {
    if (appState === 'LANDING') {
      appState = 'OUTSIDE';
      
      // Unlock all 5 videos simultaneously
      if (window.unlockMedia) window.unlockMedia();

      document.getElementById('landing-layer').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('landing-layer').style.display = 'none';
        document.getElementById('hint-layer').style.opacity = '1';
      }, 1200);

    } else if (appState === 'OUTSIDE') {
      appState = 'ENTERING';
      document.getElementById('hint-layer').style.opacity = '0';
      document.getElementById('ui-manager').style.display = 'none'; 
      window.dispatchEvent(new Event('initiate-zoom'));
    }
  }
</script>
</head>

<body onclick="handleMasterClick()">

<div id="ui-manager">
  <div id="landing-layer">
    <div id="start-text">MIRROR, MIRROR ON THE WALL</div>
    <div id="ticker">TAP TO INITIALIZE</div>
  </div>
  <div id="hint-layer">TAP TO ENTER DOME</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ────────────────────────────────────────────────
// Scene Setup
// ────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010103);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
camera.position.set(0, 50, 250); 
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.5, 0.2);
composer.addPass(bloomPass);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enabled = false; 
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false; 
controls.target.set(0, 15, 0);
controls.maxPolarAngle = Math.PI / 2 + 0.05; 
controls.minDistance = 8;
controls.maxDistance = 90;

// ────────────────────────────────────────────────
// Dynamic Video Texture Pipeline
// ────────────────────────────────────────────────
function createVideo(url) {
    const v = document.createElement('video');
    v.src = url;
    v.muted = true;
    v.playsInline = true;
    v.loop = true;
    v.crossOrigin = 'anonymous';
    v.setAttribute('webkit-playsinline', 'webkit-playsinline');
    v.setAttribute('playsinline', 'playsinline');
    v.setAttribute('loop', 'true');
    // Failsafe loop trigger
    v.addEventListener('ended', () => { v.currentTime = 0; v.play(); });
    return v;
}

// Instantiate all video elements
const vortexVid = createVideo('https://files.catbox.moe/4ab3h5.mp4');
const frameVid = createVideo('https://files.catbox.moe/wmhz50.mp4');
const floorVid = createVideo('https://files.catbox.moe/ot3ez3.mp4');
const innerVid = createVideo('https://files.catbox.moe/ut650a.mp4');
const outerVid = createVideo('https://files.catbox.moe/cfxyi1.mp4');

// Group for the master unlocker
const mediaPool = [vortexVid, frameVid, floorVid, innerVid, outerVid];
window.unlockMedia = () => { 
    mediaPool.forEach(vid => vid.play().catch(e => console.warn("Autoplay constraint:", e))); 
};

// Convert to THREE VideoTextures
const vortexTex = new THREE.VideoTexture(vortexVid); vortexTex.colorSpace = THREE.SRGBColorSpace;
const frameTex = new THREE.VideoTexture(frameVid); frameTex.colorSpace = THREE.SRGBColorSpace;
const floorTex = new THREE.VideoTexture(floorVid); floorTex.colorSpace = THREE.SRGBColorSpace;
const innerTex = new THREE.VideoTexture(innerVid); innerTex.colorSpace = THREE.SRGBColorSpace;
const outerTex = new THREE.VideoTexture(outerVid); outerTex.colorSpace = THREE.SRGBColorSpace;

floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(4, 4);

// ────────────────────────────────────────────────
// Environmental Geometry Mapping
// ────────────────────────────────────────────────
const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, emissive: 0xffffff, emissiveMap: floorTex, emissiveIntensity: 0.3, roughness: 0.9 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const innerDomeMat = new THREE.MeshStandardMaterial({ map: innerTex, emissive: 0xffffff, emissiveMap: innerTex, emissiveIntensity: 0.35, side: THREE.BackSide });
scene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 64, 32, 0, Math.PI*2, 0, Math.PI/2), innerDomeMat));

const outerDomeMat = new THREE.MeshStandardMaterial({ map: outerTex, emissive: 0xffffff, emissiveMap: outerTex, emissiveIntensity: 0.45, side: THREE.FrontSide });
scene.add(new THREE.Mesh(new THREE.SphereGeometry(102, 64, 32, 0, Math.PI*2, 0, Math.PI/2), outerDomeMat));

// ────────────────────────────────────────────────
// The Vortex Mirror & Frame Matrix
// ────────────────────────────────────────────────
const mirrorGroup = new THREE.Group();
const frameSize = 12; 
const innerHoleRatio = 0.26; 

// The Video Mesh
const overlapMargin = 0.04; 
const videoRadius = (frameSize * innerHoleRatio) + overlapMargin; 
const videoMat = new THREE.MeshBasicMaterial({ 
    map: vortexTex, 
    transparent: true, 
    opacity: 0,
    color: 0xd0d0d0 
});
const videoMesh = new THREE.Mesh(new THREE.CircleGeometry(videoRadius, 64), videoMat);
videoMesh.position.set(0, 0, -0.02); 
mirrorGroup.add(videoMesh);

// The Blended Video Frame Shader
const frameMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: frameTex }, time: { value: 0 }, globalAlpha: { value: 0.0 } },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; 
    uniform float time; 
    uniform float globalAlpha; 
    varying vec2 vUv; 
    void main() { 
      vec4 c = texture2D(tDiffuse, vUv); 
      float d = distance(vUv, vec2(0.5)); 
      
      float innerAlpha = smoothstep(0.24, 0.27, d); 
      float innerShadow = smoothstep(0.24, 0.32, d);
      
      // Video pulse effect synced to shader time
      vec3 pulsedColor = c.rgb * (1.0 + sin(time * 1.5) * 0.25); 
      
      float outerAlpha = smoothstep(0.48, 0.44, d); 
      float finalAlpha = globalAlpha * innerAlpha * outerAlpha;
      
      gl_FragColor = vec4(pulsedColor * innerShadow, finalAlpha); 
    }`,
  transparent: true, side: THREE.DoubleSide
});
const frameMesh = new THREE.Mesh(new THREE.PlaneGeometry(frameSize, frameSize), frameMat);
frameMesh.position.set(0, 0, 0); 
mirrorGroup.add(frameMesh);

camera.add(mirrorGroup);

// ────────────────────────────────────────────────
// Responsiveness & Lighting
// ────────────────────────────────────────────────
let targetMirrorZ = -14;
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight, aspect = w / h;
  camera.aspect = aspect; camera.updateProjectionMatrix();
  renderer.setSize(w, h); composer.setSize(w, h);
  targetMirrorZ = aspect < 1 ? -24 : -14;
});
window.dispatchEvent(new Event('resize'));

scene.add(new THREE.AmbientLight(0xffffff, 0.1));
scene.add(new THREE.PointLight(0x00ffff, 40, 150).position.set(-20, 30, 20));
scene.add(new THREE.PointLight(0xaa00ff, 40, 150).position.set(20, 30, -20));
scene.add(new THREE.DirectionalLight(0x4466ff, 1.0));

// ────────────────────────────────────────────────
// Render Loop
// ────────────────────────────────────────────────
let engineState = 'ORBITING';
let orbitAngle = 0;
let mirrorOpacity = 0;
const insideCameraPos = new THREE.Vector3(0, 12, 35);
const centerTarget = new THREE.Vector3(0, 15, 0);
const clock = new THREE.Clock();

window.addEventListener('initiate-zoom', () => { engineState = 'ZOOMING'; });

function loop() {
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  frameMat.uniforms.time.value = t;
  
  mirrorGroup.position.set(0, Math.sin(t * 1.2) * 0.35, targetMirrorZ);
  mirrorGroup.rotation.set(Math.sin(t * 0.8) * 0.02, Math.cos(t * 0.9) * 0.02, 0);

  if (engineState === 'ORBITING') {
    orbitAngle += 0.002;
    camera.position.set(Math.sin(orbitAngle) * 250, 50 + Math.sin(t * 0.5) * 10, Math.cos(orbitAngle) * 250);
    camera.lookAt(centerTarget);
  } else if (engineState === 'ZOOMING') {
    camera.position.lerp(insideCameraPos, 0.04);
    camera.lookAt(centerTarget);
    if (camera.position.distanceTo(insideCameraPos) < 1.0) {
      engineState = 'INSIDE';
      controls.enabled = true;
    }
  } else if (engineState === 'INSIDE') {
    controls.update();
    if (mirrorOpacity < 1.0) {
      mirrorOpacity += 0.015;
      videoMat.opacity = mirrorOpacity;
      frameMat.uniforms.globalAlpha.value = mirrorOpacity;
    }
  }

  composer.render();
}
loop();
</script>
</body>
</html>
