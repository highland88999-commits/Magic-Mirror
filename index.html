<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Olympus By Merlin – Emissive Dome & Mirror</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; font-family: monospace; }
    canvas { display: block; outline: none; }
    #ui-layer {
      position: absolute; top: 20px; left: 20px; color: #00ffff;
      text-shadow: 0 0 5px #00ffff; pointer-events: none; z-index: 100;
    }
  </style>
</head>
<body>

<div id="ui-layer">Swipe to look around. Scroll/Pinch to zoom in/out.</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/controls/OrbitControls.js';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/UnrealBloomPass.js';

// ────────────────────────────────────────────────
// Scene & Camera Setup
// ────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020205); // Deep, dark atmospheric base

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
camera.position.set(0, 10, 30); 
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
// Add ACESFilmic tone mapping to prevent bright colors from washing out to pure white
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// Post-processing: Global Bloom
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// Tuned bloom: higher threshold so only the bright/neon parts of the JPEGs glow heavily
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.5, 0.4);
composer.addPass(bloomPass);

// ────────────────────────────────────────────────
// Camera Controls
// ────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = true;
controls.target.set(0, 15, 0);
controls.maxPolarAngle = Math.PI / 2 + 0.1; 
controls.maxDistance = 800; 
controls.minDistance = 2;

// ────────────────────────────────────────────────
// Environment Wrapping (Emissive Setup)
// ────────────────────────────────────────────────
const textureLoader = new THREE.TextureLoader();

const floorTex = textureLoader.load('assets/Floor wrap.JPEG');
const innerDomeTex = textureLoader.load('assets/Inner dome wrap.JPEG');
const outerDomeTex = textureLoader.load('assets/Outer dome wrap.JPEG');

[floorTex, innerDomeTex, outerDomeTex].forEach(tex => {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
});
floorTex.repeat.set(4, 4);

// By setting emissiveMap to the texture itself, the image acts as its own light source.
// Adjust emissiveIntensity (0.0 to 1.0) if it is too dim or too blown out.
const floorGeo = new THREE.PlaneGeometry(1000, 1000);
const floorMat = new THREE.MeshStandardMaterial({ 
    map: floorTex, 
    emissive: 0xffffff,
    emissiveMap: floorTex,
    emissiveIntensity: 0.35, 
    roughness: 0.8,
    metalness: 0.2
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const innerDomeGeo = new THREE.SphereGeometry(100, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2);
const innerDomeMat = new THREE.MeshStandardMaterial({ 
    map: innerDomeTex, 
    emissive: 0xffffff,
    emissiveMap: innerDomeTex,
    emissiveIntensity: 0.4,
    side: THREE.BackSide, 
    roughness: 0.6 
});
const innerDome = new THREE.Mesh(innerDomeGeo, innerDomeMat);
scene.add(innerDome);

const outerDomeGeo = new THREE.SphereGeometry(102, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2);
const outerDomeMat = new THREE.MeshStandardMaterial({ 
    map: outerDomeTex, 
    emissive: 0xffffff,
    emissiveMap: outerDomeTex,
    emissiveIntensity: 0.6, // Slightly brighter for visibility when zoomed out
    side: THREE.FrontSide, 
    roughness: 0.8
});
const outerDome = new THREE.Mesh(outerDomeGeo, outerDomeMat);
scene.add(outerDome);

// ────────────────────────────────────────────────
// The Hovering Magic Mirror (Parented to Camera)
// ────────────────────────────────────────────────
const mirrorGroup = new THREE.Group();

const video = document.createElement('video');
video.src = 'assets/gemini_generated_video_763BE1F0.mp4';
video.loop = true;
video.muted = true; 
video.playsInline = true;
video.crossOrigin = "anonymous";
video.play();

const videoTex = new THREE.VideoTexture(video);
videoTex.colorSpace = THREE.SRGBColorSpace;

const vidGeo = new THREE.CircleGeometry(3.3, 64);
const vidMat = new THREE.MeshBasicMaterial({ map: videoTex });
const videoMesh = new THREE.Mesh(vidGeo, vidMat);
videoMesh.position.set(0, 0, -0.1); 
mirrorGroup.add(videoMesh);

const frameTex = textureLoader.load('assets/IMG_1488.jpeg');
const frameMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: frameTex }, time: { value: 0 } },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float time;
    varying vec2 vUv;
    void main() {
      vec4 texColor = texture2D(tDiffuse, vUv);
      float dist = distance(vUv, vec2(0.5));
      
      if(dist < 0.26) discard;
      
      float pulse = 1.0 + sin(time * 2.0) * 0.2; // Increased pulse intensity slightly
      if (texColor.r > 0.2 || texColor.b > 0.2) {
          texColor.rgb *= pulse;
      }
      
      float edgeFade = smoothstep(0.5, 0.45, dist);
      gl_FragColor = vec4(texColor.rgb * edgeFade, 1.0);
    }
  `,
  transparent: true,
  side: THREE.DoubleSide
});

const frameGeo = new THREE.PlaneGeometry(12, 12);
const frameMesh = new THREE.Mesh(frameGeo, frameMat);
frameMesh.position.set(0, 0, 0); 
mirrorGroup.add(frameMesh);

mirrorGroup.position.set(0, 0, -15);
camera.add(mirrorGroup);

// ────────────────────────────────────────────────
// Lighting (Atmospheric Fill)
// ────────────────────────────────────────────────
// A soft base ambient light
const ambient = new THREE.AmbientLight(0xffffff, 0.2); 
scene.add(ambient);

// Cyan and Magenta point lights inside to bounce off the non-emissive roughness of the textures
const cyanLight = new THREE.PointLight(0x00ffff, 40, 150);
cyanLight.position.set(-30, 20, 30);
scene.add(cyanLight);

const magentaLight = new THREE.PointLight(0xff00ff, 40, 150);
magentaLight.position.set(30, 20, -30);
scene.add(magentaLight);

// Outer directional light for the exterior dome
const directionalLight = new THREE.DirectionalLight(0xaabbff, 1.5);
directionalLight.position.set(100, 200, 100);
scene.add(directionalLight);

// ────────────────────────────────────────────────
// Logic, Resizing & Animation Loop
// ────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; 
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight); 
  composer.setSize(window.innerWidth, window.innerHeight);
});

window.addEventListener('pointerdown', () => {
    if(video.paused) video.play();
}, { once: true });

const clock = new THREE.Clock();

function loop() {
  requestAnimationFrame(loop);
  
  const elapsedTime = clock.getElapsedTime();
  
  controls.update();

  frameMat.uniforms.time.value = elapsedTime;
  
  mirrorGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.4;
  
  if (video.readyState >= video.HAVE_CURRENT_DATA) {
    videoTex.needsUpdate = true;
  }
  
  renderer.clear();
  composer.render();
}

loop();
</script>
</body>
</html>
