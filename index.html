<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Olympus By Merlin – The Vortex Mirror</title>
<style>
  body { 
    margin: 0; 
    overflow: hidden; 
    background: #010103; 
    font-family: monospace;
    touch-action: none; /* Prevents mobile swipe-to-refresh/zoom bugs */
  }
  canvas { 
    display: block; 
    outline: none;
  }
  
  /* The Master UI Controller */
  #ui-manager {
    position: fixed;
    inset: 0;
    z-index: 9999;
    cursor: pointer; /* Forces iOS to treat the whole screen as a button */
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #00ffff;
  }

  /* Phase 1: Landing Overlay */
  #landing-layer {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(rgba(1,1,3,0.35), rgba(1,1,3,0.75)), url('https://files.catbox.moe/4o8srk.jpeg') center/cover no-repeat;
    transition: opacity 1.5s ease-out;
  }
  #landing-layer::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url('https://files.catbox.moe/4o8srk.jpeg') center/cover no-repeat;
    transform: scaleX(-1);
    filter: blur(1.5px) brightness(1.15) contrast(1.1);
    animation: slowPan 50s linear infinite;
    opacity: 0.9;
    z-index: 0;
  }

  /* Landing Text Formatting */
  #start-text {
    font-size: clamp(1.9rem, 6vw, 3rem);
    letter-spacing: 8px;
    text-shadow: 0 0 25px #00ffff, 0 0 60px #00ffff, 0 0 90px #0088ff;
    z-index: 2;
    animation: float 4.5s ease-in-out infinite;
  }
  #ticker {
    font-size: clamp(0.95rem, 2.8vw, 1.15rem);
    letter-spacing: 5px;
    color: #00ffcc;
    margin-top: 18px;
    z-index: 2;
    animation: ticker 1.6s linear infinite, glitch 0.4s infinite;
  }

  /* Phase 2: Enter Dome Prompt */
  #hint-layer {
    position: absolute;
    bottom: 15%;
    font-size: clamp(1rem, 3vw, 1.5rem);
    letter-spacing: 5px;
    text-shadow: 0 0 15px #00ffff;
    opacity: 0; 
    transition: opacity 1.5s ease-in;
    z-index: 3;
    pointer-events: none; /* Text doesn't block clicks */
  }

  /* Keyframes */
  @keyframes ticker { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
  @keyframes glitch { 0% { text-shadow: 1px 0 #ff00ff, -1px 0 #00ffff; } 20% { text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff; } 40% { text-shadow: 1px 0 #00ffff, -1px 0 #ff00ff; } 100% { text-shadow: 1px 0 #ff00ff, -1px 0 #00ffff; } }
  @keyframes slowPan { 0% { background-position: 25% 50%; } 100% { background-position: 75% 50%; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
</style>
</head>
<body>

<div id="ui-manager">
  <div id="landing-layer">
    <div id="start-text">MIRROR, MIRROR ON THE WALL</div>
    <div id="ticker">TAP TO INITIALIZE</div>
  </div>
  <div id="hint-layer">
    TAP TO ENTER DOME
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/controls/OrbitControls.js';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/UnrealBloomPass.js';

// ────────────────────────────────────────────────
// Scene & Camera Setup
// ────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010103);

// Camera starts far out to orbit the exterior
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
camera.position.set(0, 50, 250); 
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.5, 0.3);
composer.addPass(bloomPass);

// ────────────────────────────────────────────────
// Orbit Controls (Locked initially)
// ────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enabled = false; 
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false; // Disable panning so they stay centered in the room
controls.target.set(0, 15, 0);
controls.maxPolarAngle = Math.PI / 2 + 0.05; // Prevent breaking through floor
controls.minDistance = 8;
controls.maxDistance = 90;

// ────────────────────────────────────────────────
// External Asset Loading
// ────────────────────────────────────────────────
const loader = new THREE.TextureLoader();
loader.setCrossOrigin('anonymous');

const floorTex = loader.load('https://files.catbox.moe/6xph8n.JPEG');
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(4, 4);
floorTex.colorSpace = THREE.SRGBColorSpace;

const innerDomeTex = loader.load('https://files.catbox.moe/vpvm1x.JPEG');
innerDomeTex.colorSpace = THREE.SRGBColorSpace;

const outerDomeTex = loader.load('https://files.catbox.moe/vhffm6.JPEG');
outerDomeTex.colorSpace = THREE.SRGBColorSpace;

const frameTex = loader.load('https://files.catbox.moe/98i4rp.jpeg');

// ────────────────────────────────────────────────
// Environment Geometries
// ────────────────────────────────────────────────
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(1000, 1000), 
  new THREE.MeshStandardMaterial({ map: floorTex, emissive: 0x112233, emissiveIntensity: 0.25, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(100, 64, 32, 0, Math.PI*2, 0, Math.PI/2), 
  new THREE.MeshStandardMaterial({ map: innerDomeTex, emissive: 0x00aaff, emissiveIntensity: 0.4, side: THREE.BackSide })
));

scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(102, 64, 32, 0, Math.PI*2, 0, Math.PI/2), 
  new THREE.MeshStandardMaterial({ map: outerDomeTex, emissive: 0xff00aa, emissiveIntensity: 0.55, side: THREE.FrontSide })
));

// ────────────────────────────────────────────────
// The Vortex Mirror (Locked to Camera)
// ────────────────────────────────────────────────
const mirrorGroup = new THREE.Group();

const video = document.createElement('video');
video.src = 'https://files.catbox.moe/4ab3h5.mp4';
video.muted = true;
video.playsInline = true;
video.preload = 'auto';
video.loop = false;
video.crossOrigin = 'anonymous';

const videoTex = new THREE.VideoTexture(video);
videoTex.colorSpace = THREE.SRGBColorSpace;
videoTex.minFilter = THREE.LinearFilter;
videoTex.magFilter = THREE.LinearFilter;

// Video mesh starts fully transparent (opacity: 0)
const videoMat = new THREE.MeshBasicMaterial({ map: videoTex, transparent: true, opacity: 0 });
const videoMesh = new THREE.Mesh(new THREE.CircleGeometry(3.3, 64), videoMat);
videoMesh.position.set(0, 0, -0.15);
mirrorGroup.add(videoMesh);

// Frame shader starts fully transparent (globalAlpha: 0.0)
const frameMat = new THREE.ShaderMaterial({
  uniforms: { 
    tDiffuse: { value: frameTex }, 
    time: { value: 0 },
    globalAlpha: { value: 0.0 } 
  },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time; uniform float globalAlpha; varying vec2 vUv; void main() { 
    vec4 c = texture2D(tDiffuse, vUv); float d = distance(vUv, vec2(0.5));
    if(d < 0.262) discard; 
    c.rgb *= (1.0 + sin(time * 1.5) * 0.25);
    gl_FragColor = vec4(c.rgb * smoothstep(0.5, 0.44, d), globalAlpha); }`,
  transparent: true,
  side: THREE.DoubleSide
});

const frameMesh = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), frameMat);
mirrorGroup.add(frameMesh);

// Lock mirror precisely in front of the camera
mirrorGroup.position.set(0, 0, -14);
camera.add(mirrorGroup);

// ────────────────────────────────────────────────
// Lighting
// ────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.15));
scene.add(new THREE.PointLight(0x00ffff, 60, 150).position.set(-20, 30, 20));
scene.add(new THREE.PointLight(0xaa00ff, 60, 150).position.set(20, 30, -20));
scene.add(new THREE.DirectionalLight(0x4466ff, 1.2));

// ────────────────────────────────────────────────
// UI State Machine & Interaction Logic
// ────────────────────────────────────────────────
let appState = 'LANDING'; // Flow: LANDING -> OUTSIDE -> ENTERING -> INSIDE
const uiManager = document.getElementById('ui-manager');
const landingLayer = document.getElementById('landing-layer');
const hintLayer = document.getElementById('hint-layer');

function handleInteraction(e) {
  // Prevent ghost clicks
  e.preventDefault(); 
  
  if (appState === 'LANDING') {
    appState = 'OUTSIDE';
    
    // Crucial iOS Fix: Unlock video playback on the very first touch
    video.play().catch(console.error);

    // Fade out landing screen
    landingLayer.style.opacity = '0';
    
    // Wait for fade, then show the hint text
    setTimeout(() => {
      landingLayer.style.display = 'none';
      if (appState === 'OUTSIDE') hintLayer.style.opacity = '1';
    }, 1500);

  } else if (appState === 'OUTSIDE') {
    appState = 'ENTERING';
    
    // Hide hint and DESTROY the UI manager's ability to intercept clicks
    hintLayer.style.opacity = '0';
    uiManager.style.pointerEvents = 'none'; 
  }
}

// Bind to both touch and click for universal mobile compatibility
uiManager.addEventListener('touchstart', handleInteraction, { passive: false });
uiManager.addEventListener('click', handleInteraction);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ────────────────────────────────────────────────
// Cinematic Animation Loop
// ────────────────────────────────────────────────
const clock = new THREE.Clock();
let orbitAngle = 0;
let mirrorOpacity = 0;

// Hardcoded target coordinates
const insideCameraPos = new THREE.Vector3(0, 12, 35);
const centerTarget = new THREE.Vector3(0, 15, 0);

function loop() {
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  
  // Pass time to shader
  frameMat.uniforms.time.value = t;
  
  // Organic breathing effect for the mirror
  mirrorGroup.position.y = Math.sin(t * 1.2) * 0.35;
  mirrorGroup.rotation.x = Math.sin(t * 0.8) * 0.02;
  mirrorGroup.rotation.y = Math.cos(t * 0.9) * 0.02;

  // Cinematic State Machine
  if (appState === 'LANDING' || appState === 'OUTSIDE') {
    // Phase 1 & 2: Orbit exterior of the dome
    orbitAngle += 0.002;
    camera.position.x = Math.sin(orbitAngle) * 250;
    camera.position.z = Math.cos(orbitAngle) * 250;
    camera.position.y = 50 + Math.sin(t * 0.5) * 10;
    camera.lookAt(centerTarget);
    
  } else if (appState === 'ENTERING') {
    // Phase 3: Fly straight into the dome
    camera.position.lerp(insideCameraPos, 0.035);
    camera.lookAt(centerTarget);
    
    // Check if we reached the inside
    if (camera.position.distanceTo(insideCameraPos) < 1.0) {
      appState = 'INSIDE';
      controls.enabled = true; // Unlock your panning rules!
    }
    
  } else if (appState === 'INSIDE') {
    // Phase 4: Full Control & Mirror Fade-In
    controls.update();
    
    // Magically fade the mirror into view now that we are inside
    if (mirrorOpacity < 1.0) {
      mirrorOpacity += 0.01;
      videoMat.opacity = mirrorOpacity;
      frameMat.uniforms.globalAlpha.value = mirrorOpacity;
    }
  }

  // Optimize video texture updates
  if (video.readyState >= video.HAVE_CURRENT_DATA) {
    videoTex.needsUpdate = true;
  }
  
  composer.render();
}

loop();
</script>
</body>
</html>
