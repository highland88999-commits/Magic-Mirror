<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Olympus By Merlin – The Vortex Mirror</title>
  <style>
    body { margin: 0; overflow: hidden; background: #010103; font-family: monospace; }
    canvas { display: block; outline: none; }
    #ui-layer {
      position: absolute; top: 20px; left: 20px; color: #00ffff;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.6); pointer-events: none; z-index: 100;
      letter-spacing: 1px; font-size: 14px;
    }
  </style>
</head>
<body>

<div id="ui-layer">SYSTEM_INITIALIZING // Awaiting assets...</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/controls/OrbitControls.js';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/UnrealBloomPass.js';

// ────────────────────────────────────────────────
// Scene & Renderer Setup
// ────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010103); 

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
camera.position.set(0, 10, 30); 
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1; 
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// Post-processing: Synthwave Bloom
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.25, 0.6, 0.35);
composer.addPass(bloomPass);

// ────────────────────────────────────────────────
// Camera Controls (Locked & Fluid)
// ────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.enablePan = false; 
controls.target.set(0, 15, 0);
controls.maxPolarAngle = Math.PI / 2 + 0.05; 
controls.maxDistance = 800; 
controls.minDistance = 1;

// ────────────────────────────────────────────────
// Asset Loading Manager (Finds the broken files)
// ────────────────────────────────────────────────
const uiLayer = document.getElementById('ui-layer');
const manager = new THREE.LoadingManager();

manager.onStart = function (url, itemsLoaded, itemsTotal) {
    uiLayer.innerText = `SYSTEM_LOADING // ${Math.round((itemsLoaded / itemsTotal) * 100)}%`;
};

manager.onLoad = function () {
    uiLayer.innerText = 'SYSTEM_ONLINE // Swipe to rotate. Pinch to scale. Tap to initialize sequence.';
};

manager.onError = function (url) {
    // If a file 404s, this will print the exact broken path to your screen
    uiLayer.innerText = `ERROR // Failed to load: ${url}`;
    uiLayer.style.color = "#ff0044"; 
};

const textureLoader = new THREE.TextureLoader(manager);

// ────────────────────────────────────────────────
// Environment Wrapping 
// ────────────────────────────────────────────────
// encodeURI safely handles the spaces in your file names for web routing
const floorTex = textureLoader.load(encodeURI('assets/Floor wrap.JPEG'));
const innerDomeTex = textureLoader.load(encodeURI('assets/Inner dome wrap.JPEG'));
const outerDomeTex = textureLoader.load(encodeURI('assets/Outer dome wrap.JPEG'));
const frameTex = textureLoader.load(encodeURI('assets/IMG_1488.jpeg'));

[floorTex, innerDomeTex, outerDomeTex].forEach(tex => {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
});
floorTex.repeat.set(4, 4);

const floorGeo = new THREE.PlaneGeometry(1000, 1000);
const floorMat = new THREE.MeshStandardMaterial({ 
    map: floorTex, 
    emissive: 0xffffff,
    emissiveMap: floorTex,
    emissiveIntensity: 0.25, 
    roughness: 0.9,
    metalness: 0.1
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const innerDomeGeo = new THREE.SphereGeometry(100, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2);
const innerDomeMat = new THREE.MeshStandardMaterial({ 
    map: innerDomeTex, 
    emissive: 0xffffff,
    emissiveMap: innerDomeTex,
    emissiveIntensity: 0.35,
    side: THREE.BackSide, 
    roughness: 0.8 
});
const innerDome = new THREE.Mesh(innerDomeGeo, innerDomeMat);
scene.add(innerDome);

const outerDomeGeo = new THREE.SphereGeometry(102, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2);
const outerDomeMat = new THREE.MeshStandardMaterial({ 
    map: outerDomeTex, 
    emissive: 0xffffff,
    emissiveMap: outerDomeTex,
    emissiveIntensity: 0.5, 
    side: THREE.FrontSide, 
    roughness: 0.9
});
const outerDome = new THREE.Mesh(outerDomeGeo, outerDomeMat);
scene.add(outerDome);

// ────────────────────────────────────────────────
// The Hovering Magic Mirror (Camera Tracking)
// ────────────────────────────────────────────────
const mirrorGroup = new THREE.Group();

const video = document.createElement('video');
video.src = 'assets/gemini_generated_video_763BE1F0.mp4';
video.loop = true;
video.muted = true; 
video.playsInline = true; // Critical for mobile iOS
video.crossOrigin = "anonymous";
video.play();

const videoTex = new THREE.VideoTexture(video);
videoTex.colorSpace = THREE.SRGBColorSpace;
videoTex.minFilter = THREE.LinearFilter;
videoTex.magFilter = THREE.LinearFilter;

const vidGeo = new THREE.CircleGeometry(3.3, 64);
const vidMat = new THREE.MeshBasicMaterial({ map: videoTex });
const videoMesh = new THREE.Mesh(vidGeo, vidMat);
videoMesh.position.set(0, 0, -0.15); 
mirrorGroup.add(videoMesh);

const frameMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: frameTex }, time: { value: 0 } },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float time;
    varying vec2 vUv;
    void main() {
      vec4 texColor = texture2D(tDiffuse, vUv);
      float dist = distance(vUv, vec2(0.5));
      
      if(dist < 0.262) discard; 
      
      float pulse = 1.0 + sin(time * 1.5) * 0.25; 
      if (texColor.r > 0.15 || texColor.b > 0.15) {
          texColor.rgb *= pulse;
      }
      
      float edgeFade = smoothstep(0.5, 0.44, dist); 
      gl_FragColor = vec4(texColor.rgb * edgeFade, 1.0);
    }
  `,
  transparent: true,
  side: THREE.DoubleSide
});

const frameGeo = new THREE.PlaneGeometry(12, 12);
const frameMesh = new THREE.Mesh(frameGeo, frameMat);
frameMesh.position.set(0, 0, 0); 
mirrorGroup.add(frameMesh);

mirrorGroup.position.set(0, 0, -14);
camera.add(mirrorGroup);

// ────────────────────────────────────────────────
// Cinematic Lighting
// ────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xffffff, 0.1); 
scene.add(ambient);

const cyanLight = new THREE.PointLight(0x00ffff, 60, 150);
cyanLight.position.set(-20, 30, 20);
scene.add(cyanLight);

const magentaLight = new THREE.PointLight(0xaa00ff, 60, 150);
magentaLight.position.set(20, 30, -20);
scene.add(magentaLight);

const directionalLight = new THREE.DirectionalLight(0x4466ff, 1.2);
directionalLight.position.set(100, 200, 100);
scene.add(directionalLight);

// ────────────────────────────────────────────────
// Logic, Resizing & Animation Loop
// ────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; 
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight); 
  composer.setSize(window.innerWidth, window.innerHeight);
});

// Autoplay bypass for mobile browsers
window.addEventListener('pointerdown', () => {
    if(video.paused) video.play();
    uiLayer.style.opacity = 0; 
    uiLayer.style.transition = 'opacity 1s ease-out';
}, { once: true });

const clock = new THREE.Clock();

function loop() {
  requestAnimationFrame(loop);
  
  const elapsedTime = clock.getElapsedTime();
  
  controls.update();
  frameMat.uniforms.time.value = elapsedTime;
  
  // Organic, breathing hover effect for the mirror
  mirrorGroup.position.y = Math.sin(elapsedTime * 1.2) * 0.35;
  mirrorGroup.rotation.x = Math.sin(elapsedTime * 0.8) * 0.02; 
  mirrorGroup.rotation.y = Math.cos(elapsedTime * 0.9) * 0.02; 
  
  if (video.readyState >= video.HAVE_CURRENT_DATA) {
    videoTex.needsUpdate = true;
  }
  
  renderer.clear();
  composer.render();
}

loop();
</script>
</body>
</html>
