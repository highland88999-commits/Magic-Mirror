<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Olympus By Merlin – Rune Mirror</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; font-family: monospace; }
    canvas { display: block; }
  </style>
</head>
<body>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';
import { FontLoader } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/loaders/FontLoader.js';
import { TextGeometry } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/geometries/TextGeometry.js';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/UnrealBloomPass.js';

// ────────────────────────────────────────────────
// Scene Setup
// ────────────────────────────────────────────────
const scene = new THREE.Scene();
// Keep the room strictly black for now
scene.background = new THREE.Color(0x000000); 

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Post-processing (Black Bloom configuration)
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 0.5, 0.2);
composer.addPass(bloomPass);

// ────────────────────────────────────────────────
// Sequence / Video Element (The Water/Magic)
// ────────────────────────────────────────────────
const video = document.createElement('video');
// Sourced from your GitHub assets structure
video.src = 'assets/gemini_generated_video_763BE1F0.mp4';
video.loop = true;
video.muted = true; // Required for autoplay without interaction
video.playsInline = true;
video.crossOrigin = "anonymous";
video.play();

const videoTex = new THREE.VideoTexture(video);
videoTex.minFilter = THREE.LinearFilter;
videoTex.magFilter = THREE.LinearFilter;

// Create the circular screen for the video to sit on
const vidGeo = new THREE.CircleGeometry(3.3, 64);
const vidMat = new THREE.MeshBasicMaterial({ map: videoTex });
const videoMesh = new THREE.Mesh(vidGeo, vidMat);
videoMesh.position.set(0, 5, -5.1); // Pushed slightly back
scene.add(videoMesh);

// ────────────────────────────────────────────────
// The Rune Frame (IMG_1488.jpeg)
// ────────────────────────────────────────────────
const textureLoader = new THREE.TextureLoader();
const frameTex = textureLoader.load('assets/IMG_1488.jpeg');

// Custom shader to auto-mask the black center and blend edges
const frameMat = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: frameTex },
    time: { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float time;
    varying vec2 vUv;
    
    void main() {
      vec4 texColor = texture2D(tDiffuse, vUv);
      
      // Calculate distance from center of the image (0.5, 0.5)
      float dist = distance(vUv, vec2(0.5));
      
      // Discard the center pixels to create the hole for the video
      // Note: Adjust 0.26 if the hole is too big or too small
      if(dist < 0.26) {
        discard;
      }
      
      // Optional pulse effect on the neon runes based on color intensity
      float pulse = 1.0 + sin(time * 2.0) * 0.1;
      if (texColor.r > 0.2 || texColor.b > 0.2) {
          texColor.rgb *= pulse;
      }

      // Fade out the hard square edges of the JPEG into the black void
      float edgeFade = smoothstep(0.5, 0.45, dist);
      
      gl_FragColor = vec4(texColor.rgb * edgeFade, 1.0);
    }
  `,
  transparent: true,
  side: THREE.DoubleSide
});

const frameGeo = new THREE.PlaneGeometry(12, 12);
const frameMesh = new THREE.Mesh(frameGeo, frameMat);
frameMesh.position.set(0, 5, -5.0); // Placed slightly in front of the video
scene.add(frameMesh);


// ────────────────────────────────────────────────
// Lighting & Objects
// ────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xffffff, 0.1); 
scene.add(ambient);

// ────────────────────────────────────────────────
// Resize + Animate
// ────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; 
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight); 
  composer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();

function loop() {
  requestAnimationFrame(loop);
  
  const delta = clock.getDelta();
  const elapsedTime = clock.getElapsedTime();
  
  // Pass time to frame shader for neon pulse
  frameMat.uniforms.time.value = elapsedTime;
  
  // Update video texture
  if (video.readyState >= video.HAVE_CURRENT_DATA) {
    videoTex.needsUpdate = true;
  }
  
  renderer.clear();
  composer.render();
}

// Click listener to trigger video (browsers require interaction to un-mute or play unmuted audio if needed later)
window.addEventListener('click', () => {
    if(video.paused) {
        video.play();
    }
});

loop();

</script>
</body>
</html>
