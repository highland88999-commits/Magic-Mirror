<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Olympus By Merlin – The Vortex Mirror</title>
<style>
  body { 
    margin: 0; 
    overflow: hidden; 
    background: #010103; 
    font-family: monospace;
  }
  canvas { 
    display: block; 
    outline: none;
    pointer-events: none; /* let start screen get clicks first */
  }
  canvas.enabled {
    pointer-events: auto; /* enable after start */
  }
  #start-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: linear-gradient(rgba(1,1,3,0.35), rgba(1,1,3,0.75)), url('https://files.catbox.moe/4o8srk.jpeg') center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #00ffff;
    text-align: center;
    cursor: pointer;
    transition: opacity 1.8s ease-out, visibility 1.8s ease-out;
    overflow: hidden;
    touch-action: manipulation;
  }
  #start-screen.hidden { 
    opacity: 0; 
    visibility: hidden;
    pointer-events: none;
  }
  #start-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url('https://files.catbox.moe/4o8srk.jpeg') center/cover no-repeat;
    transform: scaleX(-1);
    filter: blur(1.5px) brightness(1.15) contrast(1.1);
    animation: slowPan 50s linear infinite;
    opacity: 0.9;
  }
  #start-text {
    font-size: clamp(1.9rem, 6vw, 3rem);
    letter-spacing: 8px;
    text-shadow: 0 0 25px #00ffff, 0 0 60px #00ffff, 0 0 90px #0088ff;
    z-index: 2;
    position: relative;
    animation: float 4.5s ease-in-out infinite;
    pointer-events: none;
  }
  #ticker {
    font-size: clamp(0.95rem, 2.8vw, 1.15rem);
    letter-spacing: 5px;
    color: #00ffcc;
    margin-top: 18px;
    z-index: 2;
    position: relative;
    animation: ticker 1.6s linear infinite, glitch 0.4s infinite;
    pointer-events: none;
  }
  @keyframes ticker { 0%,100% { opacity: 0.35; } 50% { opacity: 1; }
  @keyframes glitch { 0% { text-shadow: 1px 0 #ff00ff, -1px 0 #00ffff; } 20% { text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff; } 40% { text-shadow: 1px 0 #00ffff, -1px 0 #ff00ff; } 100% { text-shadow: 1px 0 #ff00ff, -1px 0 #00ffff; }
  @keyframes slowPan { 0% { background-position: 25% 50%; } 100% { background-position: 75% 50%; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); }
</style>
</head>
<body>
<div id="start-screen">
  <div id="start-text">MIRROR, MIRROR ON THE WALL</div>
  <div id="ticker">TAP TO INITIALIZE SEQUENCE</div>
</div>

video.loop = false;
