<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Olympus By Merlin – The Vortex Mirror</title>
<style>
  body { 
    margin: 0; overflow: hidden; background: #010103; font-family: monospace;
    touch-action: none; -webkit-touch-callout: none; user-select: none;
  }
  canvas { display: block; outline: none; }
  
  /* UI Manager */
  #ui-manager {
    position: fixed; inset: 0; z-index: 9999; cursor: pointer;
    display: flex; align-items: center; justify-content: center; text-align: center; color: #00ffff;
  }
  #landing-layer {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(rgba(1,1,3,0.35), rgba(1,1,3,0.75)), url('https://files.catbox.moe/4o8srk.jpeg') center/cover no-repeat;
    transition: opacity 1.2s ease-out;
  }
  #start-text {
    font-size: clamp(1.5rem, 5vw, 3rem); letter-spacing: 6px;
    text-shadow: 0 0 25px #00ffff, 0 0 60px #00ffff, 0 0 90px #0088ff; z-index: 2;
  }
  #ticker {
    font-size: clamp(0.85rem, 2.5vw, 1.15rem); letter-spacing: 4px; color: #00ffcc; margin-top: 18px; z-index: 2;
    animation: ticker 1.6s linear infinite;
  }
  #hint-layer {
    position: absolute; bottom: 12%; font-size: clamp(1rem, 3vw, 1.5rem); letter-spacing: 5px;
    text-shadow: 0 0 15px #00ffff; opacity: 0; transition: opacity 1.5s ease-in; z-index: 3; pointer-events: none;
  }
  @keyframes ticker { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
</style>

<!-- STEP 1 & 2: ISOLATED DOM LOGIC AND ERROR CATCHER -->
<script>
  // If anything breaks, print it to the screen so we can see it on the phone
  window.onerror = function(msg, url, lineNo, columnNo, error) {
    document.getElementById('ticker').innerText = 'SYS_ERR: ' + msg;
    document.getElementById('ticker').style.color = '#ff0044';
    return false;
  };

  let appState = 'LANDING';

  // Natively attached to the HTML to guarantee it fires
  function handleMasterClick() {
    if (appState === 'LANDING') {
      appState = 'OUTSIDE';
      
      // Force UI fade
      document.getElementById('landing-layer').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('landing-layer').style.display = 'none';
        document.getElementById('hint-layer').style.opacity = '1';
      }, 1200);

      // Signal the 3D Engine that the user has interacted
      window.dispatchEvent(new Event('user-interaction-started'));

    } else if (appState === 'OUTSIDE') {
      appState = 'ENTERING';
      document.getElementById('hint-layer').style.opacity = '0';
      document.getElementById('ui-manager').style.display = 'none'; // Obliterate UI
      
      // Signal 3D Engine to zoom in
      window.dispatchEvent(new Event('user-entering-dome'));
    }
  }
</script>
</head>

<!-- Natively bind the click directly to the body/UI wrapper -->
<body onclick="handleMasterClick()">

<div id="ui-manager">
  <div id="landing-layer">
    <div id="start-text">MIRROR, MIRROR ON THE WALL</div>
    <div id="ticker">TAP TO INITIALIZE</div>
  </div>
  <div id="hint-layer">TAP TO ENTER DOME</div>
</div>

<!-- STEP 3: THE 3D ENGINE -->
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/controls/OrbitControls.js';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010103);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
camera.position.set(0, 50, 250); 
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.5, 0.3));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enabled = false; 
controls.enableDamping = true;
controls.enablePan = false; 
controls.target.set(0, 15, 0);

// Basic Lighting so we can see if it loads
scene.add(new THREE.AmbientLight(0xffffff, 0.15));
scene.add(new THREE.PointLight(0x00ffff, 60, 150).position.set(-20, 30, 20));

// Setup Engine Variables
let engineState = 'ORBITING';
let orbitAngle = 0;
const insideCameraPos = new THREE.Vector3(0, 12, 35);
const centerTarget = new THREE.Vector3(0, 15, 0);
const clock = new THREE.Clock();

// Listen for the isolated DOM events
window.addEventListener('user-interaction-started', () => {
    // We can confidently initialize audio/video here because user has tapped
    console.log("3D Engine registered Phase 1");
});

window.addEventListener('user-entering-dome', () => {
    engineState = 'ZOOMING';
});

function loop() {
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  
  if (engineState === 'ORBITING') {
    orbitAngle += 0.002;
    camera.position.x = Math.sin(orbitAngle) * 250;
    camera.position.z = Math.cos(orbitAngle) * 250;
    camera.position.y = 50 + Math.sin(t * 0.5) * 10;
    camera.lookAt(centerTarget);
  } else if (engineState === 'ZOOMING') {
    camera.position.lerp(insideCameraPos, 0.04);
    camera.lookAt(centerTarget);
    if (camera.position.distanceTo(insideCameraPos) < 1.0) {
      engineState = 'INSIDE';
      controls.enabled = true;
    }
  } else if (engineState === 'INSIDE') {
    controls.update();
  }

  composer.render();
}
loop();
</script>
</body>
</html>
